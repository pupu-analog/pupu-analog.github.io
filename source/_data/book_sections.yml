# 书籍页的子分类配置
# 每个分类 = 一组条目，每条独占一行。
# 条目格式：名字; 阅读整理
#   - name        : 显示的名字（名字链接到 url）
#   - url         : 名字要跳转的网址（Google 搜索该书 PDF）
#   - reading     : 分号后的文字，固定为「阅读整理」
#   - reading_url : 「阅读整理」跳转到的笔记 md 页
# 后续添加条目：在对应分类的 items 下追加一条即可，不需要改页面代码。

