# 书籍页的子分类配置
# 每个分类渲染为一整行横向网格；卡片横向排列，宽度超出一行时自动换行。
# 卡片格式：名字:读书整理
#   - name        : 显示的名字，点击跳转到 url
#   - url         : 名字要跳转的网址（站内路径或完整 http(s) 链接）
#   - reading     : 冒号后的文字，默认「读书整理」
#   - reading_url : 可选，读书整理文字的跳转网址；留空则只显示文字
# 后续添加内容：在对应分类的 items 下追加一条即可，不需要改页面代码。
# 新增分类：复制一个 - key: ... 块，改 key/title，追加到 sections 末尾。

sections:
  - key: foundations
    title: 子分类一
    items:
      - name: 模拟电子技术基础
        url: /books/book1/
        reading: 读书整理
        reading_url: /books/book1/
      - name: 模拟集成电路设计与仿真
        url: /books/book2/
        reading: 读书整理
        reading_url: /books/book2/

  - key: converters
    title: 子分类二
    items:
      - name: ADC 架构与设计
        url: /books/book3/
        reading: 读书整理
        reading_url: /books/book3/

  - key: notes
    title: 子分类三
    items: []
