# 书籍页的子分类配置
# 每个分类 = 一组条目，每条独占一行。
# 条目格式：名字; 阅读整理
#   - name : 名字，点击跳转到 url（你预设的网址：站内路径或完整 http(s) 链接）
#   - url  : 名字要跳转的网址
#   - reading : 分号后的内容——「阅读整理」是你要写的文字，将来直接写在这里，不是链接
# 后续添加条目：在对应分类的 items 下追加一条即可，不需要改页面代码。
# 新增分类：复制一个 - key: ... 块，改 key/title，追加到 sections 末尾。

sections:
  - key: foundations
    title: 子分类一
    items:
      - name: 模拟电子技术基础
        url: /books/book1/
        reading: 阅读整理
      - name: 模拟集成电路设计与仿真
        url: /books/book2/
        reading: 阅读整理

  - key: converters
    title: 子分类二
    items:
      - name: ADC 架构与设计
        url: /books/book3/
        reading: 阅读整理

  - key: notes
    title: 子分类三
    items: []
