# topic 页配置（/topic/）
# 每个子分类下方竖向分成两列：第一列 items（外部资料链接），第二列 topics（topic 落地页）。
#   - items  : name + url（名字链接到外部资料页 / Google 搜索）
#   - topics : name + id（名字链接到 /topic/<id>/ 落地页）
# 后续添加：在对应分类的 items / topics 下追加即可；新增分类则复制一个 section 块。

sections:
  - key: circuit-techniques
    title: 电路技术
    items:
      - name: 模拟电路设计技术汇总
        url: https://www.google.com/search?q=analog+circuit+design+techniques+CMOS
    topics:
      - name: 负反馈控制
        id: negative-feedback
      - name: DEM
        id: dem
      - name: Auto-Zero
        id: auto-zero
      - name: Chopper
        id: chopper
      - name: Σ-Δ
        id: sigma-delta
      - name: Switch-Capacitor
        id: switch-capacitor
      - name: Switch-Resistor
        id: switch-resistor
      - name: Charge-Pump
        id: charge-pump
      - name: PWM & PFM Modulation
        id: pwm-pfm-modulation
      - name: Dither
        id: dither
      - name: Incremental
        id: incremental
      - name: Burst
        id: burst

  - key: thermal
    title: 芯片的热
