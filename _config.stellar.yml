# 关闭左侧栏
leftbar:
  enabled: false

# 启用顶部栏
topbar:
  enabled: true
  brand:
    image:
      src: /images/avatar.svg
      variant: avatar
    name: pupu analog
    tagline: 模拟设计读书与实践笔记
    href: /
  menu:
    - id: home
      title: 主页
      url: /
    - id: blog
      title: 博客
      url: /blog/
    - id: books
      title: 书籍
      url: /books/
    - id: blocks
      title: 模块
      url: /blocks/
    - id: projects
      title: 项目
      url: /projects/
    - id: others
      title: 其它
      url: /others/
    - id: tools
      title: 工具
      url: /tools/
    - id: tbd
      title: 待整理
      url: /tbd/
  widgets: [spacer, menu, settings]

# 首页单独覆盖，确保顶栏在根路径显示
profiles:
  home:
    topbar:
      enabled: true
      widgets: [spacer, menu, settings]
  blog_index:
    listing_nav:
      enabled: false

# 页脚身份与导航
footer:
  content: '© 2026 pupu · 本站内容除特别声明外采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议。'
  sitemap:
    - title: 站点
      items:
        - '[主页](/)'
        - '[博客](/blog/)'
        - '[归档](/archives/)'
        - '[书籍](/books/)'
        - '[模块](/blocks/)'
        - '[项目](/projects/)'
    - title: 更多
      items:
        - '[其它](/others/)'
        - '[工具](/tools/)'
        - '[待整理](/tbd/)'
        - '[GitHub](https://github.com/pupu-analog)'

# SEO
canonical:
  host: pupu-analog.github.io
structured_data:
  same_as:
    - https://github.com/pupu-analog

# 首页专用样式，沿用 designers-guide.org 的宽幅单栏文档风格
inject:
  head_end: |
    <style>
    .guide-home { max-width: 980px; margin: 0 auto; padding: 24px 20px 56px; color: var(--color-text-primary, #24313d); font-family: var(--font-serif, Georgia, "Times New Roman", serif); line-height: 1.7; }
    .guide-home a { color: var(--color-link, #1b5e9c); text-decoration: none; }
    .guide-home a:hover { text-decoration: underline; }
    .guide-masthead { width: 100%; border: 1px solid #b9c6d2; border-radius: 4px; overflow: hidden; }
    .guide-masthead img { display: block; width: 100%; height: auto; }
    .guide-intro h1 { font-size: 28px; font-weight: 500; margin: 28px 0 12px; }
    .guide-intro p { font-size: 15px; margin: 0 0 14px; }
    .guide-sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 24px 0 32px; }
    .guide-section { border: 1px solid var(--color-border-tertiary, #d5dce3); border-radius: 8px; padding: 14px 16px; background: var(--color-background-primary, #fff); }
    .guide-section h3 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
    .guide-section p { margin: 0; font-size: 13px; color: var(--color-text-secondary, #53606d); }
    .guide-whats-new h2 { font-size: 22px; font-weight: 500; border-bottom: 2px solid #2c4d70; padding-bottom: 8px; margin: 0 0 20px; }
    .guide-update { border-bottom: 1px solid var(--color-border-tertiary, #d5dce3); padding: 12px 0; }
    .guide-update h3 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
    .guide-update-date { margin: 0 0 6px; font-size: 12px; color: var(--color-text-tertiary, #77828d); }
    .guide-update-excerpt { margin: 0; font-size: 14px; color: var(--color-text-secondary, #53606d); }
    /* 书籍页：每个子分类 = 一组条目，每条独占一行 */
    .bk-section { margin: 0 0 30px; }
    .bk-section-title { font-size: 20px; font-weight: 500; border-bottom: 2px solid #2c4d70; padding-bottom: 8px; margin: 0 0 14px; }
    .bk-grid { display: flex; flex-direction: column; gap: 10px; }
    .bk-item { display: flex; align-items: baseline; font-size: 15px; line-height: 1.5; }
    .bk-name { color: var(--color-link, #1b5e9c); text-decoration: none; }
    .bk-name:hover { text-decoration: underline; }
    .bk-sep { color: var(--color-text-secondary, #53606d); }
    .bk-reading { color: var(--color-link, #1b5e9c); text-decoration: none; }
    a.bk-reading:hover { text-decoration: underline; }
    .bk-empty { font-size: 14px; color: var(--color-text-tertiary, #77828d); }
    @media (max-width: 640px) { .guide-sections { grid-template-columns: 1fr; } .guide-home { padding: 16px 14px 40px; } }
    </style>
